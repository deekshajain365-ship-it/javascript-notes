<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM LEARNING -4</title>
</head>
<body style="background-color: #212121; color: azure;">
    <ul class="language">
        <li>javascript</li>

    </ul>
</body>
<style>

</style>
<script>
    // innerTExt , traverse all existing elemeents before adding it to the end 
     function addLanguage(langName){
        const li = document.createElement('li')
        li.innerHTML= langName;
        document.querySelector('.language').appendChild(li)
     }  
     addLanguage('python') 
     addLanguage("typeScript")

      //Optimized approach to edit and remove elements in DOM
     function addLangName ( langname){
        const li= document.createElement('li')
        li.appendChild(document.createTextNode(langname))
        document.querySelector('.language').appendChild(li)
     }
     addLangName('golang')


     //EDIT: 
     const secLang= document.querySelector('li:nth-child(2)')
     // secLang.innerText='Mojo'

     const newli = document.createElement('li')
     newli.textContent='Mojo'
     secLang.replaceWith(newli)

     const firstLang = document.querySelector("li:first-child")
     firstLang.outerHTML ='<li>Ruby</li>'

     //REMOVE
     const lastLang = document.querySelector('li:last-child')
     lastLang.remove()
     
</script>
</html>
